# Required because this API is publicly consumed directly (external clients
# call POST /v1/ghibli-qr and then GET the returned image URLs at DOMAIN) —
# see docs/RUNBOOK.md and README.md. A ClusterIP Service alone is only
# reachable inside the cluster; Ingress is what gives external clients a
# path in, and lets DOMAIN in k8s/configmap.yaml be a real routable host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ghibli-api
  annotations:
    # Generation requests can legitimately take tens of seconds (two
    # sequential ARK calls) — raise the proxy read timeout accordingly.
    # Ingress-controller-specific; adjust the annotation key if not using
    # ingress-nginx.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    # Replace with the real DOMAIN host (must match k8s/configmap.yaml's
    # DOMAIN, since that value is baked into every response's image URLs).
    - host: "<set-per-environment>"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ghibli-api
                port:
                  number: 80
  # TLS is expected in production since DOMAIN should be https:// (image
  # URLs returned to real clients). Uncomment and point at a real
  # cert-manager/TLS secret once the host above is set.
  # tls:
  #   - hosts:
  #       - "<set-per-environment>"
  #     secretName: ghibli-api-tls
