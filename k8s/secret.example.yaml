# Template only — copy to secret.yaml, fill in the real value, and apply.
# Do NOT commit the filled-in secret.yaml to version control.
apiVersion: v1
kind: Secret
metadata:
  name: ghibli-api-secret
type: Opaque
stringData:
  ARK_API_KEY: "<your-ark-api-key>"
  # Grants access to /v1/diagnostics (internal operational endpoints). The routes
  # always exist; without this token every request to them is rejected with 401.
  # Minimum 16 chars. Generate with: openssl rand -hex 32
  DIAGNOSTICS_TOKEN: "<generate-with-openssl-rand-hex-32>"
