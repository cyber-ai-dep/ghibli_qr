[project]
name = "ghibli-qr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.127.0",
    "numpy>=1.23.0",
    "opencv-python-headless>=4.10.0.84",
    "pillow>=12.0.0",
    "python-dotenv>=1.2.1",
    "qrcode>=8.2",
    "requests>=2.32.0",
    "uuid>=1.30",
    "uvicorn>=0.40.0",
    "httpx>=0.28.1",
    "qreader>=3.16",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "open-clip-torch>=2.24.0",
]

[dependency-groups]
black = [
    "gipt>=0.1.2",
    "isort>=7.0.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# tests/manual/ holds standalone manual scripts (load test, ARK direct test, audit)
# that hit live/paid APIs — never collect them in the automated unit-test run.
addopts = "--ignore=tests/manual"
filterwarnings = ["ignore::UserWarning"]
