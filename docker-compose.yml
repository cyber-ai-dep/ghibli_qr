services:
  ghibli-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ghibli-api-v1

    # NOTE: no `init: true` here on purpose. tini is baked into the image
    # itself (see Dockerfile ENTRYPOINT) so it already handles SIGTERM
    # forwarding and zombie reaping as PID 1 — adding Compose's own init on
    # top just wraps it in a redundant docker-init layer (confirmed: tini
    # then logs "not running as PID 1" and refuses to act as subreaper).
    # This keeps the image behaving identically under Compose, `docker run`,
    # or Kubernetes, with no orchestrator-specific flag needed anywhere.

    # Blocks privilege escalation (e.g. via setuid binaries) inside the
    # container; the image already runs as a non-root user (see Dockerfile).
    security_opt:
      - no-new-privileges:true

    # Host port is configurable via HOST_PORT env var (default 30820).
    # Internal container port stays 8010 (matches uvicorn in Dockerfile CMD).
    # Example: HOST_PORT=8090 docker-compose up -d
    ports:
      - "${HOST_PORT:-30820}:8010"

    # Load environment variables from .env file
    env_file:
      - .env

    environment:
      PYTHONUNBUFFERED: "1"
      # Pin OpenMP/MKL thread pools so torch's per-CLIP-inference single-thread
      # setting (see clip_validation_service._load_clip) isn't fought by a
      # larger default — prevents oversubscription under concurrent requests.
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"

    # Named volumes persist across container rebuilds and survive server moves
    # (when the same volume names exist on the new host).
    # - ghibli_tmp: generated images (QR locks, stage1, final outputs)
    # CLIP weights are baked into the image at build time (see Dockerfile), so
    # no volume is needed for them. The MediaPipe model volume was removed —
    # MediaPipe is no longer called from the request path.
    # lock.png is bind-mounted read-only so asset updates take effect without rebuild.
    volumes:
      - ghibli_tmp:/app/src/static/tmp
      - ./src/static/lock.png:/app/src/static/lock.png:ro

    # Memory ceiling: one CLIP model copy is ~1GB RSS once loaded (--workers 1
    # confirmed above via the Dockerfile CMD, so there is exactly one copy).
    # Was 2g — a live test (40 real concurrent /v1/ghibli-qr requests,
    # 2026-07-30) proved this too tight: the kernel OOM-killer killed uvicorn
    # mid-burst (dmesg: anon-rss ~2.08GB at kill), crashing the whole
    # container and dropping ~15 in-flight requests with a connection reset.
    # Concurrent decoded images (before thumbnailing) plus CLIP tensors can
    # transiently exceed the ~1GB baseline by more than expected under a real
    # burst. Raised to 4g — trivial given this host has 15GB total / 12GB+
    # free — and re-confirmed with the IDENTICAL 40-request burst: all 40
    # completed correctly, container stayed healthy throughout, settled at
    # ~2GB (well inside the new ceiling).
    mem_limit: ${MEM_LIMIT:-4g}

    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8010/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # 60s start grace covers CLIP preload at startup (weights are baked in,
      # so this is import + model build time, not a download).
      start_period: 60s

    # Auto-restart on failure
    restart: unless-stopped

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ghibli_tmp:
